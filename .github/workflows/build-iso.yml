name: Build Kora OS ISO
on:
  push:
    tags: ['v*']          # git tag v0.4 && git push --tags  -> builds and publishes a release
  workflow_dispatch:      # manual run from the Actions tab -> ISO as a downloadable artifact
permissions:
  contents: write
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h / /mnt
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3-pil qemu-system-x86 ovmf socat
      - name: Build
        run: |
          V=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || V=dev-${GITHUB_SHA::7}
          sudo mkdir -p /mnt/out && sudo KORA_VERSION=$V WORK=/mnt/kora bash build/kora-build.sh /mnt/out/kora-os-$V.iso
          ls -lh /mnt/out
      - name: Boot test (QEMU, UEFI, USB)
        run: bash build/tools/boot-test.sh $(ls /mnt/out/*.iso)
      - name: Boot screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: boot-screen, path: "*.ppm", if-no-files-found: ignore}
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: /mnt/out/*
          body_path: docs/release-notes.md
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kora-os-iso
          path: /mnt/out/*
          retention-days: 7
