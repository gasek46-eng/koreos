# Kora OS — Hyprland
source = ~/.config/hypr/theme.conf
monitor = , preferred, auto, 1
exec-once = kora-autostart
env = XCURSOR_THEME, breeze_cursors
env = XCURSOR_SIZE, 24
input {
  kb_layout = us,ru
  kb_options = grp:alt_shift_toggle
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}
general {
  gaps_in = 6
  gaps_out = 14
  border_size = 1
  layout = dwindle
}
decoration {
  rounding = 12
  shadow {
    enabled = true
    range = 28
    render_power = 3
    color = rgba(00000066)
  }
  blur {
    enabled = true
    size = 8
    passes = 2
  }
}
animations {
  enabled = true
  bezier = kora, 0.22, 1, 0.36, 1
  animation = windows, 1, 4, kora, popin 88%
  animation = fade, 1, 4, kora
  animation = workspaces, 1, 5, kora, slide
}
dwindle {
  preserve_split = true
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}
$mod = SUPER
bind = $mod, SPACE, exec, wofi --show drun
bind = $mod, RETURN, exec, foot
bind = $mod, E, exec, nautilus
bind = $mod, Q, killactive
bind = $mod, L, exec, kora-lock
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, I, exec, kora-settings
bind = , Print, exec, kora-shot
bind = SHIFT, Print, exec, kora-shot area
bind = $mod, LEFT, movewindow, l
bind = $mod, RIGHT, movewindow, r
bind = $mod, UP, movewindow, u
bind = $mod, DOWN, movewindow, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q s 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
